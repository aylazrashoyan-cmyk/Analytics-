<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#F5F5F7">
  <title>Analytics Flow</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  
  <!-- Подключаем библиотеку для работы с Excel -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body>
  <!-- Экран блокировки (ввод PIN) -->
  <div id="auth-gate" class="auth-gate"></div>

  <!-- Основное приложение (скрыто до ввода PIN) -->
  <div class="app hidden" id="app">
    <header class="app-header" id="app-header"></header>
    <main id="screen" class="screen"></main>
    <nav id="nav" class="bottom-nav"></nav>
  </div>

  <!-- Всплывающие уведомления и модальные окна -->
  <div id="toast-container" class="toast-container"></div>
  <div id="modal-root" class="modal-root"></div>

  <!-- ПОДКЛЮЧЕНИЕ СКРИПТОВ (строгий порядок) -->
  <script src="crypto.js"></script>
  <script src="db.js"></script>
  <script src="parser.js"></script>
  <script src="app.js"></script>
  <script src="screens/stores.js"></script>
  <script src="screens/home.js"></script>
  <script src="screens/settings.js"></script>
  <script src="screens/analytics.js"></script>
  <script src="screens/rails.js"></script>
  <!-- auth.js всегда загружается последним -->
  <script src="auth.js"></script>
</body>
</html>
